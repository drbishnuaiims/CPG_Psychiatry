  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">

  <meta property="og:url" content="https://drbishnuaiims.github.io/CPG_Psychiatry/search.html">

  <meta name="twitter:card" content="summary">

  <meta name="twitter:description" content="Search psychiatry clinical practice guideline notes.">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html" aria-label="Psychiatry CPG Notes home">
      <div class="brand-mark">CPG</div>
      <div>
        <div class="brand-name">Psychiatry CPG Notes</div>
        <div class="brand-subtitle">Clinical Practice Guideline Notes</div>
      </div>
    </a>

    <div class="header-actions">
      <a class="nav-link" href="index.html">Home</a>
      <button class="theme-toggle" id="themeToggle" type="button">☾ Dark</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="container">
    <h1>Search Guidelines</h1>
    <p class="page-intro">
      Search by psychiatric disorder, clinical topic, category or guideline name.
    </p>

    <form class="search-box" id="searchForm" role="search">
      <label class="sr-only" for="searchInput">Search clinical practice guidelines</label>
      <input
        id="searchInput"
        type="search"
        placeholder="e.g. schizophrenia, bipolar disorder, OCD..."
        autocomplete="off"
        autofocus
      >
      <button class="search-button" type="submit">Search</button>
    </form>

    <div class="results-count" id="resultsCount" aria-live="polite"></div>
    <div id="results"></div>
  </div>
</main>

<footer class="footer">
  <div class="footer-inner">Psychiatry CPG Notes</div>
</footer>

<button class="back-to-top" id="backToTop" type="button" aria-label="Back to top">↑</button>

<script src="js/site.js"></script>

</html>
